unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# start with window 1 
set -g base-index 1
set -g renumber-windows on

# PLEASE LET ME SCROLL UP PLS DONT USE MY SCROLL WHEEL FOR ZSH HISTORY
set -g mouse on

setw -g mode-keys vi

# swap to last window
bind a last-window
# kill curr window
bind-key x kill-pane 
# list all windows
bind-key w list-windows
bind-key n next-window
bind-key p previous-window  

set -g status-bg black
set -g status-fg white

set -g window-status-format "[#I] #W"
set -g window-status-current-format '[#I] #W '
set-option -g window-status-current-style fg=colour16,bg=color183   # active window style

set -g status-left ''
set -g status-right ''

bind r source ~/.tmux.conf \; display "reloaded config!"

set-option -g detach-on-destroy off         # don't exit tmux when killing session
set-option -g destroy-unattached off       # keep sessions even if no clients attached
bind-key s list-sessions                   # list all sessions
bind-key d detach-client                   # detach from session (can reattach later)

set -s escape-time 0
